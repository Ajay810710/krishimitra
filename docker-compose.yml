version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: krishimitra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krishimitra
      POSTGRES_PASSWORD: krishimitra_dev_password
      POSTGRES_DB: krishimitra_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U krishimitra']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: krishimitra_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ───────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: krishimitra_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://krishimitra:krishimitra_dev_password@postgres:5432/krishimitra_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  # ── Next.js Web ──────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: krishimitra_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AI_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  # ── FastAPI AI ───────────────────────────────────
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: krishimitra_ai
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://krishimitra:krishimitra_dev_password@postgres:5432/krishimitra_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/ai:/app

  # ── pgAdmin ──────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: krishimitra_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@krishimitra.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

  # ── Redis Commander ──────────────────────────────
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: krishimitra_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data: